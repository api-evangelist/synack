aid: synack
name: Synack
description: >-
  Synack is a crowdsourced security testing platform that pairs the Synack Red
  Team — a global community of vetted security researchers — with AI-enabled
  attack-surface discovery to deliver continuous penetration testing,
  vulnerability management, and compliance-grade assessments. The Synack
  Enterprise API exposes assessments, assets, asset discovery (seed groups and
  seeds), vulnerabilities and suspected vulnerabilities, missions and campaigns,
  tagging, tests, users, and streaming analytics across nine REST services,
  secured with OAuth2 scopes and JWT bearer tokens.

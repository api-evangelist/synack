            type: array
            items:
              $ref: '#/components/schemas/SingleAssetRelationship'
          externalRelationships:
            description: External relationships which this asset participates in as a source. When used in postAssetBulk request, AssetID and AssetUID will be set automatically.
            type: array
            items:
              $ref: '#/components/schemas/ExternalRelationship'
          gateways:
            description: Array of Launchpoint-managed VPN gateways per listing.
            readOnly: true
            type: array
            items:
              $ref: '#/components/schemas/AssetGateway'
      - $ref: '#/components/schemas/Updatable'
    ApplicationBinary:
      type: object
      properties:
        version:
          type: string
          readOnly: true
        downloadUrl:
          type: string
          format: uri
    SingleAsset:
      oneOf:
      - $ref: '#/components/schemas/CloudAccountAsset'
      - $ref: '#/components/schemas/HostAsset'
      - $ref: '#/components/schemas/MobileApplicationAsset'
      - $ref: '#/components/schemas/NetworkAsset'
      - $ref: '#/components/schemas/WebApplicationAsset'
      discriminator:
        propertyName: assetType
        mapping:
          cloudaccount: '#/components/schemas/CloudAccountAsset'
          host: '#/components/schemas/HostAsset'
          mobileapp: '#/components/schemas/MobileApplicationAsset'
          network: '#/components/schemas/NetworkAsset'
          webapp: '#/components/schemas/WebApplicationAsset'
    Port:
      allOf:
      - type: object
        required:
        - scope
        - observedState
        properties:
          number:
            $ref: '#/components/schemas/PortNumber'
          protocol:
            $ref: '#/components/schemas/PortProtocol'
          scope:
            $ref: '#/components/schemas/Scope'
          service:
            type: string
            description: 'Name of (expected) service running on port. Will use the [Service Name and Transport Protocol Port Number Registry](https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml) for well-known ports.

              '
          observedState:
            $ref: '#/components/schemas/PortObservedState'
          detectedService:
            type: string
            description: 'Name of detected service running on port according to fingerprinting.

              '
            readOnly: true
          detectedProductName:
            type: string
            description: 'Name of software product running on port according to fingerprinting.

              '
            readOnly: true
          detectedProductVersion:
            type: string
            description: Version of software product running on port according to fingerprinting.
            readOnly: true
          detectedProductConfidenceLevel:
            type: integer
            format: int
            minimum: 1
            maximum: 10
            description: Confidence level of detected product on port according to fingerprinting.
            readOnly: true
          detectedProductCPE:
            type: string
            description: 'CPE for detected product according to fingerprinting.

              '
            readOnly: true
          serviceBanner:
            type: string
            description: Port banner according to fingerprinting.
            readOnly: true
      - $ref: '#/components/schemas/Updatable'
    ListingUID:
      type: string
      pattern: ^[-_0-9a-z]{1,50}
      description: Unique identifier for an listing.
      readOnly: true
    ApplicationAsset:
      type: object
      properties:
        userRoles:
          description: User roles available for the application.
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
  headers:
    ETag:
      description: An identifier for a specific version of a resource
      schema:
        type: string
        pattern: ^(?:W\/)?\".*\"$
    PaginationTotalCount:
      description: Total number of items in all pages of a paginated response.
      schema:
        format: int32
        minimum: 1
    Link:
      description: Standard link header.
      schema:
        type: string
    PaginationCurrentPage:
      description: Current page in a paginated response.
      schema:
        type: integer
        format: int32
        minimum: 1
    PaginationTotalPages:
      description: Total number of pages in a paginated response.
      schema:
        type: integer
        format: int32
        minimum: 1
    PaginationLimit:
      description: Maximum number of items returned in a paginated response.
      schema:
        type: integer
        format: int32
        minimum: 1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
